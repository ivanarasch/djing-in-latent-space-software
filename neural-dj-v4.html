<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEURAL DJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lacquer&display=swap" rel="stylesheet">
<script src="./libraries/musicvae.js"></script>
<script src="./song-chunks.js?v=14"></script>
<script>
var densityVector = null;
fetch('./data/density_vector.json')
  .then(r => r.json())
  .then(v => { densityVector = v; console.log('density vector loaded'); });
 
var densityVariants = null;
fetch('./data/density_variants.json')
  .then(r => r.json())
  .then(v => { densityVariants = v; console.log('density variants loaded'); });
 
var intervalVariants = null;
fetch('./data/interval_variants.json')
  .then(r => r.json())
  .then(v => { intervalVariants = v; console.log('interval variants loaded'); });
</script>
<script src="./libraries/tone.js"></script>
<script src="./libraries/StartAudioContext.js"></script>
<style>
 
 
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #ffffff;
  --paper: #ffffff;
  --ink: #1a1714;
  --ink-faint: #000000;
  --ink-mid: #000000;
  --red: #000000;
  --green: #000000;
  --font: 'Lacquer', system-ui;
}
body {
  background-image: url('./white-crumpled-paper-texture-background-vector.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-color: transparent;
  color: var(--ink);
  font-family: var(--font);
  height: 100vh;
  overflow: hidden;
  user-select: none;
}
 
 
 
/* HEADER - pd style title bar */
header {
  display:flex; justify-content:space-between; align-items:center;
  padding:6px 12px;
  border-bottom: 2px solid var(--ink);
  background:#ffffff;
  font-size:11px; letter-spacing:0.05em;
}
.logo { font-weight:700; font-size:12px; }
.logo span { color:var(--ink); }
.hdr-r { display:flex; gap:16px; font-size:9px; color:var(--ink-mid); align-items:center; }
.led { width:10px;height:10px;border:1px solid var(--ink);border-radius:50%;display:inline-block;margin-right:4px;background:transparent; }
.led.g { background:var(--ink-mid); }
.led.o { background:#000000; }
 
/* MAIN */
.main { display:grid; grid-template-columns:1fr 140px 1fr; height:calc(100vh - 34px); }
 
/* DECK - like a pd subpatch box */
.deck {
  display:flex; flex-direction:column; padding:10px; gap:8px;
  border-right:2px solid var(--ink);
  background:transparent;
}
.deck-b { border-right:none; border-left:2px solid var(--ink); }
 
.deck-hdr {
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid var(--ink); padding-bottom:5px; margin-bottom:2px;
}
.deck-id { font-size:10px; font-weight:700; letter-spacing:0.1em; }
 
/* pd-style select */
select.ss {
  font-family:var(--font); font-size:9px;
  background:#ffffff; color:var(--ink);
  border:1px solid var(--ink);
  padding:2px 5px; cursor:pointer; outline:none;
}
 
/* PIANO ROLL - pd array style */
.rl { font-size:8px; letter-spacing:0.05em; color:var(--ink-mid); margin-bottom:1px;  }
canvas.roll {
  width:100%; height:48px;
  border:1px solid var(--ink);
  background:#ffffff;
  display:block;
}
canvas.broll {
  width:100%; height:30px;
  border:1.5px solid var(--ink-faint);
  background:#ffffff;
  display:block; margin-top:3px;
}
 
/* PLATTER */
.pa { display:flex; align-items:center; gap:12px; justify-content:center; padding:6px 0; }
.sw {
  position:relative; width:170px; height:170px;
  cursor:ns-resize; flex-shrink:0;
  transform-origin:center center;
}
.sw svg { width:100%;height:100%;transform-origin:center center; }
.sc{display:none;}
.si { display:none; }
.pi { display:flex;flex-direction:column;gap:3px; }
.ps { font-size:28px;font-weight:700;letter-spacing:-0.02em;line-height:1;  }
.pl { font-size:7px;color:var(--ink-mid);letter-spacing:0.1em;text-transform:uppercase; }
 
/* KNOBS - pd number boxes style */
.ks { display:flex;flex-direction:column;gap:10px;flex:1; }
.tl { font-size:20px;letter-spacing:0.05em;color:var(--ink-mid);border-top:1px solid var(--ink-faint);padding-top:4px; }
.tl.bass { color:var(--ink-mid); }
.kr { display:grid;grid-template-columns:repeat(3,1fr);gap:4px; }
.kc { display:flex;flex-direction:column;align-items:center;gap:1px; }
 
/* pd-style number box knob */
.knob {
  width:50px;height:50px;border-radius:50%;position:relative;cursor:ns-resize;
  background: transparent;
  border:3px solid var(--ink);
  
}
.knob.bk { border-color:var(--ink-mid);  }
.kd { position:absolute;top:4px;left:50%;width:2px;height:9px;background:var(--ink);border-radius:0;transform-origin:bottom center;transform:translateX(-50%) rotate(0deg); }
.knob.bk .kd { background:var(--ink-mid); }
.kn { font-size:10px;letter-spacing:0.05em;color:var(--ink-mid);text-align:center; }
.kv { font-size:10px;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums; }
 
/* CENTER */
.center {
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:10px 8px;
  border-left:1px solid var(--ink-faint);
  border-right:1px solid var(--ink-faint);
  background:(255,255,255,0.85);
}
.bpm-n { font-size:38px;font-weight:700;line-height:1;letter-spacing:-0.03em; }
.bpm-u { font-size:8px;color:var(--ink-mid);letter-spacing:0.1em; }
input[type=range].tv {
  -webkit-appearance:none;writing-mode:vertical-lr;direction:rtl;
  width:16px;height:60px;cursor:pointer;outline:none;margin-top:4px;background:transparent;
}
input[type=range].tv::-webkit-slider-runnable-track{width:3px;background:var(--ink);border:none;}
input[type=range].tv::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:12px;background:#ffffff;border:2px solid var(--ink);border-radius:0;margin-left:-9px;cursor:pointer;}
 
/* pd-style button */
.pbtn {
  width:48px;height:48px;border-radius:50%;cursor:pointer;
  background:#ffffff;
  border:2px solid var(--ink);
  color:var(--ink);font-size:14px;
  display:flex;align-items:center;justify-content:center;
  
  
  font-family:var(--font);
}
.pbtn:active{background:#000000;color:#ffffff;}
.pbtn.playing{background:#000000;color:#ffffff;}
 
/* crossfader */
.cf-lb{display:flex;justify-content:space-between;font-size:9px;font-weight:700;margin-bottom:3px;}
.cf-la{color:var(--ink);} .cf-lb2{color:var(--ink-mid);}
input[type=range].cf{-webkit-appearance:none;width:100%;height:16px;background:transparent;outline:none;cursor:pointer;}
input[type=range].cf::-webkit-slider-runnable-track{height:3px;background:var(--ink);border:none;}
input[type=range].cf::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:20px;background:#ffffff;border:2px solid var(--ink);border-radius:0;margin-top:-9px;cursor:pointer;}
.cf-al{text-align:center;font-size:9px;color:var(--ink-mid);margin-top:2px;}
 
/* steps - pd array bars */
.sr{display:flex;gap:1px;width:100%;height:20px;align-items:flex-end;}
.sb{flex:1;background:#000000;opacity:0.15;border:none;min-height:3px;cursor:pointer;}
.sb.pre{background:#000000;}
.sb.cur{background:#000000;}
.sb.post{background:var(--ink-mid);opacity:0.7;}
 
/* deck buttons */
.dbtn-row { display:flex; gap:4px; width:10%; margin-top:4px; }
.btn-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin-top:6px; width:100%; }
.btn-cues { display:flex; gap:6px; justify-content:center; margin-top:8px; }
.btn-cues .dbtn { width:60px !important; height:44px !important; min-height:0 !important; flex-shrink:0; }
.btn-pair { display:grid; grid-template-columns:1fr 1fr; gap:2px; margin-top:2px; }
.btn-pair .dbtn { width:100%; }
.btn-solo { margin-top:2px; width:100%; }
.btn-play-wrap { margin-top:6px; }
.dbtn.span2 { grid-column:span 2; }
.dbtn {
  flex:1; font-family:var(--font); font-size:8px; padding:8px 8px;
  border:1.5px solid var(--ink); background:#fff; cursor:pointer;
  color:var(--ink); letter-spacing:0.05em;
}
.dbtn:active { background:#000; color:#fff; }
.dbtn.active { background:#000; color:#fff; }
.dbtn.cued { border-color:#000; background:#000; color:#fff; }
.dbtn.bass-mode { background:#000; color:#fff; }
 
 
 
/* velocity slider */
.vel-slider-wrap { display:flex; flex-direction:column; align-items:center; gap:3px; justify-content:center; }
.vel-slider { -webkit-appearance:none; writing-mode:vertical-lr; direction:rtl; width:16px; height:120px; cursor:pointer; outline:none; background:transparent; }
.vel-slider::-webkit-slider-runnable-track { width:3px; background:var(--ink); border:none; }
.vel-slider::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:12px; background:#ffffff; border:2px solid var(--ink); border-radius:0; margin-left:-9px; cursor:pointer; }
.vel-label { font-size:7px; color:var(--ink-mid); letter-spacing:0.1em; text-transform:uppercase; }
.vel-val { font-size:9px; color:var(--ink); font-variant-numeric:tabular-nums; }
 
/* status */
.status{position:fixed;bottom:0;left:0;right:0;display:flex;gap:10px;padding:3px 12px;background:#ffffff;border-top:1.5px solid var(--ink);font-size:8px;color:var(--ink-mid);}
 
/* loading */
.lov{position:fixed;inset:0;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:200;}
.ll{font-size:14px;font-weight:700;letter-spacing:0.1em;}
.ll span{color:var(--ink);}
.lbw{width:160px;height:2px;background:#000000;opacity:0.15;}
.lbf{height:100%;background:var(--ink);width:0%;}
.ls{font-size:9px;color:var(--ink-mid);}
</style>
</head>
<body>
 
<div class="lov" id="lov">
  <div class="ll">NEURAL <span>DJ</span></div>
  <div style="font-size:9px;color:var(--ink-mid);">latent space interpolation / disklavier</div>
  <div class="lbw"><div class="lbf" id="lbf"></div></div>
  <div class="ls" id="ls">loading musicvae...</div>
</div>
 
<header>
  <div class="hdr-r">
    <span><span class="led o" id="ld-m"></span></span>
    <span><span class="led" id="ld-i"></span></span>
    <span><span class="led" id="ld-o"></span></span>
    <span id="hst" style="color:var(--ink)"></span>
    <span id="hal" style="color:var(--ink)"></span>
  </div>
</header>
 
<div class="main">
  <!-- DECK A -->
  <div class="deck deck-a">
    <div class="deck-hdr">
      <div class="deck-id">deck a</div>
      <select class="ss" id="sel-a" onchange="loadDeck('a',this.value)"></select>
    </div>
    <div>
      <div class="rl">melody &mdash; array</div>
      <canvas class="roll" id="roll-a"></canvas>
      <div class="rl" style="color:var(--ink-mid);margin-top:2px;">bass &mdash; array</div>
      <canvas class="broll" id="broll-a"></canvas>
    </div>
    <div class="pa">
      <div class="vel-slider-wrap">
        <div class="vel-label">VOL</div>
        <input type="range" class="vel-slider" min="1" max="127" value="80"
          oninput="onVelSlider('a', +this.value)" id="vel-slide-a">
        <div class="vel-val" id="vel-slide-val-a">80</div>
      </div>
      <div class="sw" id="plt-a">

// Get interval-shifted notes for a deck based on INT (vel) knob
function getIntervalNotes(dk) {
  if(!intervalVariants) return null;
  var key = getDensityKey(deckSong[dk]);
  if(!key || !intervalVariants[key]) return null;
  var variants = intervalVariants[key][currentChunk[dk]];
  if(!variants) return null;
  var intVal = S.p.m[dk].int;
  var varIdx = Math.round((intVal / 100) * 10);
  varIdx = Math.max(0, Math.min(10, varIdx));
  return variants[varIdx] || null;
}
 
// Get the best transformed notes for a deck - uses whichever attribute knob
// deviates most from center (50), falling back to raw chunk
function getAttributeNotes(dk) {
  var denDev = Math.abs(S.p.m[dk].den - 50);
  var intDev = Math.abs(S.p.m[dk].int - 50);
  if(denDev >= intDev) {
    return getDensityNotes(dk) || getIntervalNotes(dk) || null;
  } else {
    return getIntervalNotes(dk) || getDensityNotes(dk) || null;
  }
}
 
// Get density-shifted notes for a deck based on DEN knob
function getDensityNotes(dk) {
  if(!densityVariants) return null;
  var song = deckSong[dk];
  var key = getDensityKey(song);
  if(!key || !densityVariants[key]) return null;
  var chunk = currentChunk[dk];
  var variants = densityVariants[key][chunk];
  if(!variants) return null;
  // DEN knob 0-100 maps to variant index 0-10
  var denVal = S.p.m[dk].den;
  var varIdx = Math.round((denVal / 100) * 10);
  varIdx = Math.max(0, Math.min(10, varIdx));
  return variants[varIdx] || null;
}
 
 
 
async function applyDensity(dk) {
  if (!densityVector || !S.mr) return;
  var dk_chunks = getChunks(deckSong[dk], 'mel');
  var chunk = dk_chunks[currentChunk[dk]];
  if (!chunk || !chunk.length) return;
 
  var seq = makeSeq(chunk);
  var amount = (S.p.m[dk].den / 100) * 4 - 2; // map 0-100 to -2..+2
 
  try {
    var z = await mv.encode([seq]);
    // z is a tensor of shape [1, 256]
    var zArr = await z.array();
    z.dispose();
 
    // shift latent vector by density direction
    var zShifted = zArr[0].map((val, i) => val + amount * (densityVector[i] || 0));
 
    // decode back using z array directly
    var decoded = await mv.decode([zShifted]);
    densitySeqs[dk] = Array.isArray(decoded) ? decoded[0] : decoded;
    dRolls();
  } catch(e) {
    console.warn('density apply failed', e);
  }
}

    deckPos[dk].step=-1;
  }
  dRolls();
}
 
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sampleBuffers = {};
let ld = false;
 
function loadSamples(){
  const sp = 'https://storage.googleapis.com/melody-mixer/piano/';
  let loaded = 0;
  for(let i = 21; i < 109; i++){
    fetch(sp + i + '.mp3')
      .then(r => r.arrayBuffer())
      .then(buf => audioCtx.decodeAudioData(buf))
      .then(decoded => {
        sampleBuffers[i] = decoded;
        loaded++;
        if(loaded === 88){ ld = true; console.log('all samples loaded'); }
      })
      .catch(() => { loaded++; if(loaded === 88) ld = true; });
  }
}
 
function pNote(p, h, v){
  if(!ld || p < 21 || p > 108) return;
  var activeDk = activeSong==='b' ? 'b' : 'a';
  var bpm = S.bpm || 78;
  var sps = (60/bpm)/4;
  const dur = sps * h * 0.85;
  const buf = sampleBuffers[p];
  if(buf){
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const gain = audioCtx.createGain();
    const vol = Math.max(0.05, Math.min(1.0, v || 0.6));
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime + Math.max(0, dur - 0.04));
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + dur);
    src.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(audioCtx.currentTime);
    src.stop(audioCtx.currentTime + dur);
  }
  if(S.mOut){
    S.mOut.send([0x90,p,Math.round(Math.max(1,Math.min(127,(v||0.6)*127)))]);
    setTimeout(()=>{if(S.mOut)S.mOut.send([0x80,p,0]);}, dur*1000);
  }
}

}
 
Tone.Transport.scheduleRepeat(()=>{
  if(!S.playing) return;

  // Advance each deck's step counter independently
  ['a','b'].forEach(dk=>{
    var pos=deckPos[dk];
    var song=deckSong[dk];
    var chunkSize=getChunkSize(song,pos.chunk);

    // advance step
    pos.step++;

    // handle reverse
    var cs=deckReverse[dk]?(chunkSize-1)-pos.step:pos.step;

    // end of chunk
    if(pos.step>=chunkSize){
      pos.step=0;
      cs=deckReverse[dk]?(chunkSize-1):0;
      if(inLoop[dk]){
        // loop chunk advance
        if(currentChunk[dk]>=loopOut) currentChunk[dk]=loopIn>=0?loopIn:currentChunk[dk];
        else currentChunk[dk]=Math.min(currentChunk[dk]+1,loopOut>=0?loopOut:currentChunk[dk]);
        deckPos[dk].chunk=currentChunk[dk];
        updateChunkDisplay();
      } else {
        // free play - advance chunk
        currentChunk[dk]=Math.min(CHUNKS-1,currentChunk[dk]+1);
        deckPos[dk].chunk=currentChunk[dk];
        updateChunkDisplay();
      }
    }

    // only play notes for the active deck
    if(activeSong!==dk) return;

    var mp=S.p.m[dk], bp=S.p.b[dk];
    var melNotes,bassNotes;

    if((inLoop.a||inLoop.b)&&S.seqs&&S.seqs[S.step]){
      melNotes=S.seqs[S.step].notes||[];
      bassNotes=S.bseqs&&S.bseqs[S.step]?S.bseqs[S.step].notes||[]:[];
    } else {
      melNotes=getAttributeNotes(dk)||getChunks(song,'mel')[currentChunk[dk]]||[];
      bassNotes=getChunks(song,'bass')[currentChunk[dk]]||[];
    }

    melNotes.filter(n=>n.quantizedStartStep===cs).forEach(n=>{
      const p=Math.round(n.pitch+mp.oct*12+mp.pch),h=n.quantizedEndStep-n.quantizedStartStep;
      const sw=mp.swg>0&&cs%2===1?(mp.swg/100)*0.1:0;
      if(sw>0)setTimeout(()=>pNote(p,h*(mp.len/100),deckVel.mel[dk]/127),sw*1000);
      else pNote(p,h*(mp.len/100),deckVel.mel[dk]/127);
    });
    bassNotes.filter(n=>n.quantizedStartStep===cs).forEach(n=>{
      if(Math.random()*100>bp.den) return;
      pNote(Math.round(n.pitch+bp.oct*12+bp.pch),(n.quantizedEndStep-n.quantizedStartStep)*(bp.len/100),deckVel.bass[dk]/127);
    });

    // update display for active deck only
    if(dk===activeSong){
      S.sp=cs;
      document.getElementById('sst').textContent=cs+'/'+chunkSize;
      document.getElementById('hst').textContent=cs+'/'+chunkSize;
      document.getElementById('spd-a').textContent=cs.toString().padStart(2,'0');
      document.getElementById('spd-b').textContent=cs.toString().padStart(2,'0');
    }
  });
},'16n');
 
function scrub(dir){
  S.sa+=dir;if(Math.abs(S.sa)<6)return;
  const mv=S.sa>0?1:-1;S.sa=0;
  const sdk=activeSong==='b'?'b':'a';
  // advance deckPos step directly so scrub integrates with tick transport
  var pos=deckPos[sdk];
  var chunkSize=getChunkSize(deckSong[sdk],currentChunk[sdk]);
  pos.step=pos.step+mv;
  if(pos.step<0){
    // wrap to previous chunk
    currentChunk[sdk]=Math.max(0,currentChunk[sdk]-1);
    deckPos[sdk].chunk=currentChunk[sdk];
    var prevChunkSize=getChunkSize(deckSong[sdk],currentChunk[sdk]);
    pos.step=prevChunkSize-1;
    updateChunkDisplay();
  } else if(pos.step>=chunkSize){
    // wrap to next chunk
    currentChunk[sdk]=Math.min(CHUNKS-1,currentChunk[sdk]+1);
    deckPos[sdk].chunk=currentChunk[sdk];
    pos.step=0;
    updateChunkDisplay();
  }
  S.sp=pos.step;
  document.getElementById('spd-a').textContent=S.sp.toString().padStart(2,'0');
  document.getElementById('spd-b').textContent=S.sp.toString().padStart(2,'0');
  var cs=S.sp;
  var melNotes=getAttributeNotes(sdk)||getChunks(deckSong[sdk],'mel')[currentChunk[sdk]]||[];
  var bassNotes=getChunks(deckSong[sdk],'bass')[currentChunk[sdk]]||[];
  melNotes.filter(n=>n.quantizedStartStep===cs).forEach(n=>{
    pNote(Math.round(n.pitch+S.p.m[sdk].oct*12+S.p.m[sdk].pch),n.quantizedEndStep-n.quantizedStartStep,deckVel.mel[sdk]/127);
  });
  bassNotes.filter(n=>n.quantizedStartStep===cs).forEach(n=>{
    pNote(Math.round(n.pitch+S.p.b[sdk].oct*12+S.p.b[sdk].pch),n.quantizedEndStep-n.quantizedStartStep,deckVel.bass[sdk]/127);
  });
}

function dRoll(id,notes,col,bg){
  const cv=document.getElementById(id);if(!cv)return;
  const dpr=window.devicePixelRatio||1;cv.width=cv.offsetWidth*dpr;cv.height=cv.offsetHeight*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);const W=cv.offsetWidth,H=cv.offsetHeight;
  ctx.fillStyle=bg||'#faf9f6';ctx.fillRect(0,0,W,H);
  // grid lines like pd array
  ctx.strokeStyle='rgba(0,0,0,0.06)';ctx.lineWidth=0.5;
  for(let i=0;i<=N;i+=4){ctx.beginPath();ctx.moveTo((i/N)*W,0);ctx.lineTo((i/N)*W,H);ctx.stroke();}
  if(!notes||!notes.length)return;
  const ps=notes.map(n=>n.pitch),mn=Math.min(...ps)-1,mx=Math.max(...ps)+1,rng=mx-mn||1;
  notes.forEach(n=>{
    const x=(n.quantizedStartStep/N)*W;
    const w=Math.max(2,((n.quantizedEndStep-n.quantizedStartStep)/N)*W-1);
    const y=H-((n.pitch-mn)/rng)*H-1;
    const h=Math.max(2,H/rng*1.5);
    ctx.fillStyle=col;
    ctx.fillRect(x,y,w,h);
  });
  // playhead - thin black line
  ctx.fillStyle='rgba(0,0,0,0.8)';
  ctx.fillRect((S.sp/N)*W,0,1.5,H);
}
function dRolls(){
  var ca=Math.max(0,currentChunk.a), cb=Math.max(0,currentChunk.b);
  var mA=getChunks(deckSong.a,'mel')[ca]||[];
  var mB=getChunks(deckSong.b,'mel')[cb]||[];
  var bA=getChunks(deckSong.a,'bass')[ca]||[];
  var bB=getChunks(deckSong.b,'bass')[cb]||[];
  if((inLoop.a||inLoop.b)&&S.seqs&&S.seqs[S.step]){mA=S.seqs[S.step].notes||[];mB=mA;}
  if((inLoop.a||inLoop.b)&&S.bseqs&&S.bseqs[S.step]){bA=S.bseqs[S.step].notes||[];bB=bA;}
  dRoll('roll-a',mA,'#000000','#ffffff');
  dRoll('roll-b',mB,'#000000','#ffffff');
  dRoll('broll-a',bA,'#000000','#ffffff');
  dRoll('broll-b',bB,'#000000','#ffffff');
}
setInterval(dRolls,80);

var noteTimers = {};  // near the top with other vars
function midiCue(note, dk, idx) {
  var now = Date.now();
  if(noteTimers[note] && now - noteTimers[note] < 300) {
    clearHotCue(dk, idx);
    noteTimers[note] = 0;
  } else {
    noteTimers[note] = now;
    setTimeout(function(){
      if(noteTimers[note] === now) hotCue(dk, idx);
    }, 300);
  }
}

function onM(msg){const[st,cc,v]=msg.data;
  //Play
  if((st&0xf0)===0x90 && cc===74 && v>0) { togglePlay('a'); return; }
  if((st&0xf0)===0x90 && cc===64 && v>0) { togglePlay('b'); return; }
 
  //LOOPING
  if((st&0xf0)===0x90 && cc===65 && v>0) { prevChunk('a'); flashBtn('btn-prev-a'); return; }
  if((st&0xf0)===0x90 && cc===59 && v>0) { prevChunk('b'); flashBtn('btn-prev-b'); return; }
  if((st&0xf0)===0x90 && cc===68 && v>0) { nextChunk('a'); flashBtn('btn-next-a'); return; }
  if((st&0xf0)===0x90 && cc===60 && v>0) { nextChunk('b'); flashBtn('btn-next-b'); return; }
  if((st&0xf0)===0x90 && cc===61 && v>0) { toggleLoop('b'); return; }
  if((st&0xf0)===0x90 && cc===66 && v>0) { toggleLoop('a'); return; }
  if((st&0xf0)===0x90 && cc===69 && v>0) { toggleReverse('a'); return; }
  if((st&0xf0)===0x90 && cc===62 && v>0) { toggleReverse('b'); return; }
  if((st&0xf0)===0x90 && cc===67 && v>0) { toggleBassMode('a'); flashBtn('btn-bass-a'); return; }
  if((st&0xf0)===0x90 && cc===63 && v>0) { toggleBassMode('b'); flashBtn('btn-bass-b'); return; }
 
 
  //CUES
  if((st&0xf0)===0x90 && v>0) {
    var cueMap = {73:['a',0], 72:['a',1], 71:['a',2], 70:['a',3],
                  58:['b',0], 57:['b',1], 56:['b',2], 55:['b',3]};
    if(cueMap[cc]) { midiCue(cc, cueMap[cc][0], cueMap[cc][1]); return; }
  }
  if((st&0xf0)!==0xb0)return;
  if(cc===12){
    const s=Math.round((v/127)*9);
    document.getElementById('cf').value=s;onCF(s);
  }
  if(cc===10)onTempo(Math.round((v/127)*140)+60);
  if(cc===9||cc===11){
    if(v===65)scrub(2);
    else if(v===64)scrub(1);
    else if(v===62)scrub(-1);
    else if(v===61)scrub(-2);
  }
  
  // deck A knobs 
const mccA={23:'int',25:'pch',24:'len',27:'den',26:'swg',22:'oct'};
if(mccA[cc]){
  const p=mccA[cc],def=KS.find(k=>k.id===p);
  if(def){
    const nv=def.min+(v/127)*(def.max-def.min);
    const el=document.querySelector(`.knob[data-d="a"][data-p="${p}"]`);
    if(el)aK(el,nv);
  }
}
// deck B knobs (CCs 20-25)
const mccB={20:'oct',31:'pch', 33:'den',32:'swg',30:'len',21:'int'};
if(mccB[cc]){
  const p=mccB[cc],def=KS.find(k=>k.id===p);
  if(def){
    const nv=def.min+(v/127)*(def.max-def.min);
    const el=document.querySelector(`.knob[data-d="b"][data-p="${p}"]`);
    if(el)aK(el,nv);
  }
}
// Sliders
if(cc===28){ onVelSlider('a', Math.round((v/127)*126)+1); }
if(cc===29){ onVelSlider('b', Math.round((v/127)*126)+1); }
}

function toggleLoop(dk) {
  dk = dk || activeSong;
  if(inLoop[dk]){
    inLoop[dk]=false;
    if(!inLoop.a && !inLoop.b){ S.seqs=null; S.bseqs=null; }
    currentChunk[dk]=deckPos[dk].chunk;
    document.getElementById('btn-loop-' + dk).classList.remove('active');
  } else {
    inLoop[dk]=true;
    activeSong=dk;
    reinterpolate();
    document.getElementById('btn-loop-' + dk).classList.add('active');
  }
}
function prevChunk(dk){
  dk=dk||activeSong;
  currentChunk[dk]=Math.max(0,currentChunk[dk]-1);
  densitySeqs[dk]=null;
  deckPos[dk].step=-1;
  if(inLoop[dk])reinterpolate();
  updateChunkDisplay();
}
function nextChunk(dk){
  dk=dk||activeSong;
  currentChunk[dk]=Math.min(CHUNKS-1,currentChunk[dk]+1);
  densitySeqs[dk]=null;
  deckPos[dk].step=-1;
  if(inLoop[dk])reinterpolate();
  updateChunkDisplay();
}
function monophonize(notes){
  // strictly one note per step, no overlaps
  var byStep={};
  notes.forEach(n=>{
    var s=n.quantizedStartStep;
    if(!byStep[s]||n.pitch>byStep[s].pitch) byStep[s]=n;
  });
  var sorted=Object.values(byStep).sort((a,b)=>a.quantizedStartStep-b.quantizedStartStep);
  // remove overlaps - end each note before next one starts
  for(var i=0;i<sorted.length-1;i++){
    if(sorted[i].quantizedEndStep>sorted[i+1].quantizedStartStep){
      sorted[i]={...sorted[i],quantizedEndStep:sorted[i+1].quantizedStartStep};
    }
  }
  return sorted;
}
 
function makeSeq(notes){
  return {
    notes: monophonize(notes),
    quantizationInfo:{stepsPerQuarter:4},
    totalQuantizedSteps:32
  };
}
 
function getChunks(song, type){
  var map=CHUNK_MAP[song];
  if(!map) return [];
  return window[map[type]]||[];
}
 
function reinterpolate(){
  if(!S.mr||!S.br) return;
  var mA=getAttributeNotes('a')||getChunks(deckSong.a,'mel')[currentChunk.a]||[];
  var mB=getAttributeNotes('b')||getChunks(deckSong.b,'mel')[currentChunk.b]||[];
  var bA=getChunks(deckSong.a,'bass')[currentChunk.a]||[];
  var bB=getChunks(deckSong.b,'bass')[currentChunk.b]||[];
  if(mA.length&&mB.length){
    try{
      S.seqs=mv.interpolate([makeSeq(mA),makeSeq(mB)],NI);
      S.seqs[0]=makeSeq(mA);S.seqs[NI-1]=makeSeq(mB);
    }catch(e){console.warn('mel interp failed',e);}
  }
  if(bA.length&&bB.length){
    try{
      S.bseqs=mb.interpolate([makeSeq(bA),makeSeq(bB)],NI);
      S.bseqs[0]=makeSeq(bA);S.bseqs[NI-1]=makeSeq(bB);
    }catch(e){console.warn('bass interp failed',e);}
  }
}
function setLoopIn(){
  loopIn=currentChunk[activeSong==='b'?'b':'a'];loopOut=-1;inLoop={a:false,b:false};
  document.getElementById('btn-li').style.background='#000';
  document.getElementById('btn-li').style.color='#fff';
  document.getElementById('loop-display').textContent='loop in: '+loopIn;
}
function setLoopOut(){
  if(loopIn<0){return;}
  loopOut=currentChunk[activeSong==='b'?'b':'a'];inLoop={a:true,b:true};
  reinterpolate();
  document.getElementById('btn-lo').style.background='#000';
  document.getElementById('btn-lo').style.color='#fff';
  document.getElementById('loop-display').textContent='loop: '+loopIn+'-'+loopOut+' [ON]';
}
function clearLoop(){
  loopIn=-1;loopOut=-1;inLoop={a:false,b:false};S.seqs=null;S.bseqs=null;
  document.getElementById('loop-display').textContent='loop: off';
}
function updateChunkDisplay(){
  var el = document.getElementById('chunk-display');
  if(el) el.textContent='chunk: '+currentChunk.a+'/'+currentChunk.b+'/33';
}
 
StartAudioContext(Tone.context, '#btn-play-a, #btn-play-b');
 
 
// velocity slider - controls mel or bass volume depending on each deck's bass mode
// NOTE: S.p.m[dk].vel is the INT knob (interval), not volume - keep them separate
function onVelSlider(dk, v) {
  if(bassMode[dk]) {
    deckVel.bass[dk] = v;
  } else {
    deckVel.mel[dk] = v;
  }
  var slider = document.getElementById('vel-slide-' + dk);
  if(slider) slider.value = v;
  document.getElementById('vel-slide-val-' + dk).textContent = v;
}
 
// reverse playback
var deckReverse = {a: false, b: false};
function toggleReverse(dk) {
  deckReverse[dk] = !deckReverse[dk];
  var btn = document.getElementById('btn-rev-' + dk);
  btn.classList.toggle('active', deckReverse[dk]);
}
 
// hot cues - {a: [null,null,null,null], b: [null,null,null,null]}
var hotCues = {a: [null,null,null,null], b: [null,null,null,null]};
var hotCueTimers = {a: [null,null,null,null], b: [null,null,null,null]};
 
function hotCue(dk, idx) {
  if(hotCues[dk][idx] === null) {
    // no cue saved - save current chunk
    hotCues[dk][idx] = currentChunk[dk];
    var btn = document.getElementById('hc-' + dk + '-' + idx);
    btn.textContent = 'C' + (idx+1) + ':' + currentChunk[dk];
    btn.classList.add('cued');
  } else {
    // cue exists - jump to it
    currentChunk[dk] = hotCues[dk][idx];
    updateChunkDisplay();
    if(inLoop.a||inLoop.b) reinterpolate();
    deckPos[dk].step=-1;
  }
}
 
function clearHotCue(dk, idx) {
  hotCues[dk][idx] = null;
  var btn = document.getElementById('hc-' + dk + '-' + idx);
  btn.textContent = 'CUE ' + (idx+1);
  btn.classList.remove('cued');
}
 
var bassMode = {a: false, b: false};
 
function toggleBassMode(dk) {
  bassMode[dk] = !bassMode[dk];
  var btn = document.getElementById('btn-bass-' + dk);
  btn.classList.toggle('bass-mode', bassMode[dk]);
  btn.textContent = bassMode[dk] ? 'BASS ON' : 'BASS MODE';
  // sync slider to whichever deckVel store is now active for this deck
  var sliderVal = bassMode[dk] ? deckVel.bass[dk] : deckVel.mel[dk];
  var slider = document.getElementById('vel-slide-' + dk);
  if(slider) slider.value = sliderVal;
  document.getElementById('vel-slide-val-' + dk).textContent = sliderVal;
  var knobs = document.querySelectorAll('.knob[data-d="' + dk + '"]');
  knobs.forEach(function(k) { k.dataset.t = bassMode[dk] ? 'b' : 'm'; });
 
  // UPDATE VISUALS to reflect whichever param store is now active
  var tp = bassMode[dk] ? 'b' : 'm';
  KS.forEach(function(def) {
    var el = document.querySelector('[data-t="' + tp + '"][data-d="' + dk + '"][data-p="' + def.id + '"]');
    if(el) {
      var currentVal = S.p[tp][dk][def.id];
      el.dataset.val = currentVal;
      sRot(el, currentVal, def.min, def.max);
      var ve = document.getElementById('v-' + tp + '-' + dk + '-' + def.id);
      if(ve) ve.textContent = def.fmt(currentVal);
    }
  });
}
